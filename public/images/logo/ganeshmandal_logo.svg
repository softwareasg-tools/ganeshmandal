<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 285 64" width="285" height="64" fill="none">
  <defs>
    <!-- Saffron & Gold Radiance Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5B8"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="50%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="bgCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1500"/>
      <stop offset="100%" stop-color="#140A00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular Sacred Emblem Background -->
  <circle cx="32" cy="32" r="28" fill="url(#bgCircle)" stroke="url(#goldGrad)" stroke-width="1.8"/>
  <circle cx="32" cy="32" r="24" fill="none" stroke="url(#saffronGrad)" stroke-width="1" stroke-dasharray="2.5 3"/>

  <!-- Sacred Tilak / Trishul Crown -->
  <path d="M32 11 L34.5 17.5 L29.5 17.5 Z" fill="url(#saffronGrad)" filter="url(#glow)"/>
  <circle cx="32" cy="18.5" r="1.5" fill="#EF4444"/>

  <!-- Lord Ganesha Silhouette (Graceful Vedic Lines) -->
  <!-- Mukut / Crown -->
  <path d="M26 21 C28 17, 36 17, 38 21 L36 24 C34 23, 30 23, 28 24 Z" fill="url(#goldGrad)"/>
  
  <!-- Forehead & Head -->
  <path d="M24 24 C28 22, 36 22, 40 24 C42 27, 42 30, 40 33 C37 32, 27 32, 24 33 C22 30, 22 27, 24 24 Z" fill="url(#goldGrad)"/>

  <!-- Trunk Curves Right (Siddhi Vinayak Dakshinabhimukhi / Purvabhimukhi grace) -->
  <path d="M30 32 C30 38, 32 44, 37 44 C41 44, 43 40, 41 38 C39 37, 37 39, 36 41 C33 41, 32 37, 32 32 Z" fill="url(#goldGrad)"/>
  
  <!-- Auspicious Modak / Sacred Pearl on Trunk Tip -->
  <circle cx="41" cy="38" r="2" fill="#FDE047" filter="url(#glow)"/>

  <!-- Left Ear -->
  <path d="M24 25 C17 26, 17 33, 23 35 C24 33, 24 28, 24 25 Z" fill="url(#goldGrad)" opacity="0.9"/>
  <!-- Right Ear -->
  <path d="M40 25 C47 26, 47 33, 41 35 C40 33, 40 28, 40 25 Z" fill="url(#goldGrad)" opacity="0.9"/>

  <!-- Sacred Eye / Trishul Mark -->
  <path d="M31 26 Q32 25 33 26 Q32 29 31 26 Z" fill="#DC2626"/>

  <!-- Brand Typography with Refined Kerning and Fallbacks -->
  <!-- GaneshMandal text -->
  <text x="68" y="34" font-family="'Cinzel', 'Cinzel Decorative', 'Georgia', 'Palatino Linotype', 'Times New Roman', serif" font-size="20.5" font-weight="800" letter-spacing="0.6" fill="url(#goldGrad)">
    GaneshMandal
  </text>
  
  <!-- .in domain accent badge with crisp breathing room -->
  <g transform="translate(232, 16)">
    <rect x="0" y="0" width="42" height="21" rx="5.5" fill="#EA580C" fill-opacity="0.35" stroke="#F59E0B" stroke-width="1.3"/>
    <text x="21" y="14.5" font-family="'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#FFD166" letter-spacing="1">
      .IN
    </text>
  </g>

  <!-- Sub-label with Balanced Letter-Spacing -->
  <text x="69" y="48" font-family="'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" letter-spacing="2.4" fill="#FBBF24" opacity="0.92">
    MAHARASHTRA FESTIVAL PORTAL
  </text>
</svg>
